<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #15130f; color: #ede6d8; font-family: "IBM Plex Sans", sans-serif; padding: 72px 80px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  body::before { content: ""; position: absolute; inset: 0 0 auto; height: 26px; background: #0e0c09 repeating-linear-gradient(90deg, transparent 0 16px, rgba(237,230,216,.18) 16px 34px, transparent 34px 50px) 0 50% / 50px 9px repeat-x; }
  body::after { content: ""; position: absolute; inset: auto 0 0; height: 26px; background: #0e0c09 repeating-linear-gradient(90deg, transparent 0 16px, rgba(237,230,216,.18) 16px 34px, transparent 34px 50px) 0 50% / 50px 9px repeat-x; }
  .brand { display: flex; align-items: center; gap: 14px; font-family: "Fraunces", serif; font-weight: 500; font-size: 34px; letter-spacing: -.02em; margin-top: 8px; }
  .brand em { color: #f0a83a; }
  .brand svg { width: 46px; height: 46px; }
  h1 { font-family: "Fraunces", serif; font-size: 84px; line-height: 1.0; letter-spacing: -.04em; font-weight: 500; margin-top: 40px; max-width: 640px; }
  h1 span { color: #f0a83a; font-style: italic; }
  p { margin-top: 22px; font-size: 27px; color: #9a917f; font-weight: 500; }
  .icons { position: absolute; right: 44px; top: 196px; display: grid; grid-template-columns: repeat(4, 92px); gap: 12px; transform: rotate(-6deg); }
  .icons img { width: 92px; height: 92px; filter: drop-shadow(0 18px 30px rgba(0,0,0,.55)); }
  .foot { margin-top: auto; margin-bottom: 8px; display: flex; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 16px; font-weight: 500; }
  .foot span { background: #25211b; border: 1px solid #2e2a22; border-radius: 999px; padding: 6px 13px; }
  .foot .url { background: none; border: 0; color: #f0a83a; padding-left: 4px; }
</style></head>
<body>
  <div class="brand"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#ede6d8"/><path d="M11 9v14M11 17l7.5-8M13.6 14.2 20 23" stroke="#c97a14" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span>Klik <em>Apps</em></span></div>
  <h1>Small apps, one <span>click</span> away.</h1>
  <p>Free &amp; open source for desktop, wrist and car.</p>
  <div class="icons">
    <img src="../public/icons/klikdb.png"><img src="../public/icons/kliksnap.png">
    <img src="../public/icons/klikreel.png"><img src="../public/icons/klikdesign.png"><img src="../public/icons/klikpaper.png"><img src="../public/icons/klikband.png"><img src="../public/icons/klikdash.png">
  </div>
  <div class="foot"><span>KlikDB</span><span>KlikSnap</span><span>KlikReel</span><span>KlikDesign</span><span>KlikPaper</span><span>KlikBand</span><span>KlikDash</span><span class="url">klikapps.pages.dev</span></div>
</body></html>
