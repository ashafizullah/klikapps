<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #111113; color: #f1f0ec; font-family: "Plus Jakarta Sans", sans-serif; padding: 72px 80px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 30px; letter-spacing: -.02em; }
  .brand svg { width: 46px; height: 46px; }
  h1 { font-size: 76px; line-height: 1.04; letter-spacing: -.04em; font-weight: 800; margin-top: 44px; max-width: 640px; }
  h1 span { color: #4cc596; }
  p { margin-top: 22px; font-size: 27px; color: #a2a1a8; font-weight: 500; }
  .icons { position: absolute; right: 64px; top: 150px; display: grid; grid-template-columns: repeat(3, 120px); gap: 18px; transform: rotate(-6deg); }
  .icons img { width: 120px; height: 120px; filter: drop-shadow(0 18px 30px rgba(0,0,0,.45)); }
  .foot { margin-top: auto; display: flex; gap: 12px; font-size: 20px; font-weight: 700; }
  .foot span { background: #26262b; border-radius: 999px; padding: 8px 18px; }
  .foot .url { background: none; color: #4cc596; padding-left: 4px; }
</style></head>
<body>
  <div class="brand"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#f1f0ec"/><path d="M11 9v14M11 17l7.5-8M13.6 14.2 20 23" stroke="#111113" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>Klik Apps</div>
  <h1>Small apps, one <span>click</span> away.</h1>
  <p>Free &amp; open source for desktop and Smart Band 9.</p>
  <div class="icons">
    <img src="../public/icons/klikdb.png"><img src="../public/icons/kliksnap.png">
    <img src="../public/icons/klikreel.png"><img src="../public/icons/klikdesign.png"><img src="../public/icons/klikband.png">
  </div>
  <div class="foot"><span>KlikDB</span><span>KlikSnap</span><span>KlikReel</span><span>KlikDesign</span><span>KlikBand</span><span class="url">klikapps.pages.dev</span></div>
</body></html>
